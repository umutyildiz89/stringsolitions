version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: string_db
    restart: always
    environment:
      POSTGRES_USER: stringuser
      POSTGRES_PASSWORD: stringpass
      POSTGRES_DB: stringsolutions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stringuser -d stringsolutions"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: string_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://stringuser:stringpass@db:5432/stringsolutions
      - SECRET_KEY=super_secret_string_solutions_key_123456!!!
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=stringsolutions2026
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: string_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
